<div class="file-upload-container">
  @if (errorMessage) {
    <div class="alert alert-danger mb-3">
      {{ errorMessage }}
    </div>
  }

  <form class="mb-4">
    <div class="file-input-container">
      <label for="fileInput" class="file-input-label">
        <span class="file-input-text">{{ fileName || 'Seleccionar archivo' }}</span>
        <span class="file-input-button">Examinar</span>
      </label>
      <input 
        id="fileInput" 
        class="file-input" 
        type="file" 
        (change)="onFileChange($event)" 
        [accept]="acceptedFileTypes"
      />
    </div>
    
    @if (fileName && !fileSizeExceeded) {
      <div class="file-info mt-2">
        <span class="file-name">{{ fileName }}</span>
        @if (selectedFile) {
          <span class="file-size">
            ({{ (selectedFile.size / 1024).toFixed(2) }} KB)
          </span>
        }
      </div>
    }
  </form>

  <div class="flex justify-between items-center">
    <div *ngIf="showExampleButton">
      <app-button
        [texto]="exampleButtonText"
        color="primary"
        type="button"
        (click)="downloadExampleFile()"
        [estaCargando]="isDownloadingExample$ | async"
        textoCargando="Descargando..."
      ></app-button>
    </div>
    
    <!-- Placeholder para mantener el layout cuando no hay botón de ejemplo -->
    <div *ngIf="!showExampleButton"></div>

    <div class="flex gap-3">
      <button 
        type="button" 
        class="btn btn-light" 
        (click)="onCancel()"
      >
        {{ cancelButtonText }}
      </button>
      <app-button
        [texto]="buttonText"
        color="primary"
        type="button"
        (click)="uploadFile()"
        [estaDeshabilitado]="!selectedFile"
        [estaCargando]="isUploading$ | async"
        [textoCargando]="buttonLoadingText"
      ></app-button>
    </div>
  </div>
</div>
