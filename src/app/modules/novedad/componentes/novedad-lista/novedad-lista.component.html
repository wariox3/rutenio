<div class="card mb-5">
  <div class="card-header">
    <h3 class="card-title">Filtros</h3>
  </div>
  <div class="card-body">
    <app-filtro-simple
      placeholder="Buscar por guía, destinatario, placa o descripción…"
      [estados]="estadosNovedad"
      localStorageKey="novedad_lista_filtro_simple"
      (aplicar)="filterChange($event)"
    ></app-filtro-simple>
  </div>
</div>

<div class="card min-w-full">
  <div class="card-header">
    <h3 class="card-title">Novedades</h3>
    <div class="flex">
      <app-button
        *appPermisoPor="'novedad.editar'"
        routerLink="/movimiento/novedad/nuevo"
        type="button"
        texto="Nuevo"
      ></app-button>
    </div>
  </div>
  <app-tabla-comun
    campoMapeo="Novedad"
    [mapeo]="mapeoDocumento"
    [datos]="novedades$ | async"
    (emitirDetalleItem)="detalleNovedad($event)"
  ></app-tabla-comun>
</div>
